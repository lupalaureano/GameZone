<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos - GameZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header aqui -->

    <section class="carrossel-principal">
        <div id="carouselPrincipal" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="img/2k27bn.avif" class="d-block w-100" alt="nba2k27">
                </div>
                <div class="carousel-item">
                    <img src="img/cyberbnft.jpeg" class="d-block w-100" alt="cyberpunk 2077">
                </div>
                <div class="carousel-item">
                    <img src="img/eafc27bn.webp" class="d-block w-100" alt="eafc 2027">
                </div>
                <div class="carousel-item">
                    <img src="img/gta6bn.webp" class="d-block w-100" alt="gta 6">
                </div>
                <div class="carousel-item">
                    <img src="img/wolvebnft.jpg" class="d-block w-100" alt="Wolverine">
                </div>
                <div class="carousel-item">
                    <img src="img/ufcbn.avif" class="d-block w-100" alt="ufc 4">
                </div>
                <div class="carousel-item">
                    <img src="img/dayszbn.webp" class="d-block w-100" alt="days gone">
                </div>
                <div class="carousel-item">
                    <img src="img/ftmiranhabn.avif" class="d-block w-100" alt="Homem aranha">
                </div>
                <div class="carousel-item">
                    <img src="img/godbn.webp" class="d-block w-100" alt="god of war">
                </div>
                <div class="carousel-item">
                    <img src="img/redbn.webp" class="d-block w-100" alt="red dead redemption 2">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselPrincipal" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselPrincipal" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
        </div>
    </section>

    <section class="hero-jogos">
        <h1 class="text-center my-4">GTA VI</h1>
        <p>Vice City, EUA.</p>
        <p><strong>Data de lançamento:</strong> 13 de novembro de 2026</p>
        <a href="#" class="btn btn-primary">Já em pré-venda</a>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
